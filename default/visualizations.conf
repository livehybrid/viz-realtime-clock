# Registration for the Dashboard Studio custom visualization.
#
# Main stanza ONLY — no [analog_clock.<option>] sub-stanzas. Options are
# declared in config.json (optionsSchema/editorConfig), which is what the
# Studio editor and the extension API actually read. Per-option sub-stanzas
# are accepted at runtime but REJECTED by Splunkbase vetting ("visualization
# stanza missing an icon") — the html-renderer app hit exactly that in
# June 2026 and had to strip them post-submission.

[analog_clock]
label = Analog Clock
description = Real-time analog clock with aviation-themed dark aesthetic. Runs at 60 fps via requestAnimationFrame. Built for AirspaceWatch.
framework_type = studio_visualization
search_fragment = | makeresults | eval _time=now() | table _time
default_height = 300
default_width = 250
allow_user_selection = 1
