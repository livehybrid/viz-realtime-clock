# Registration for the Dashboard Studio custom visualization.
#
# Shape mirrors the PROVEN-WORKING installation (hand-tuned on the reference
# Splunk 10.4 instance during the 2026 dashboard contest and recovered from it
# on 2026-08-18): the per-option sub-stanzas are part of the studio_visualization
# registration contract. The previously-committed conf lacked them and also
# registered a digital_clock viz with no assets in this app — both fixed here.

[analog_clock]
label = Analog Clock
description = Real-time analog clock with aviation-themed dark aesthetic. Runs at 60 fps via requestAnimationFrame. Built for AirspaceWatch.
framework_type = studio_visualization
search_fragment = | makeresults | eval _time=now() | table _time
default_height = 300
default_width = 250
allow_user_selection = 1

[analog_clock.handColor]
label = Hand Color
fieldType = color
defaultValue = #6aa3f8

[analog_clock.secondHandColor]
label = Second Hand Color
fieldType = color
defaultValue = #00d4aa

[analog_clock.tickColor]
label = Tick Color
fieldType = color
defaultValue = #00d4aa

[analog_clock.showDigital]
label = Show Digital Time
fieldType = radio
defaultValue = 1

[analog_clock.showDate]
label = Show Date
fieldType = radio
defaultValue = 1

[analog_clock.showGlow]
label = Glow Effect
fieldType = radio
defaultValue = 1

[analog_clock.timezone]
label = Timezone
fieldType = dropdown
defaultValue = local
allowStrings = 1
