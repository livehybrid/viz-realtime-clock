version: 2
updates:
  # Build tooling for the analog_clock visualization bundle
  - package-ecosystem: "npm"
    directory: "/appserver/static/visualizations/analog_clock"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions used by the CI/release workflow
    ignore:
      # react/react-dom are webpack externals supplied by Dashboard Studio at
      # runtime (peer range ^16-^18) — majors beyond Splunk's runtime are
      # not applicable. The webpack build is a non-shipping PoC anyway.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # babel 8 breaks the current jest/babel-jest toolchain and the webpack
      # output is a non-shipping PoC — revisit majors with the React port.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
